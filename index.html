<!doctype html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<meta name="description" content="מאמן ידע – תרגול ומבחנים למדריכי כושר: אנטומיה, פיזיולוגיה, טכניקה, תכנון אימונים, TRX, תזונה ובטיחות.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<title>מאמן ידע | מבחני כושר</title>
<script>
// קביעת ערכת צבעים לפני הטעינה כדי למנוע הבהוב
try{const s=JSON.parse(localStorage.getItem("ck_state_v3")||"{}");const t=(s.settings&&s.settings.theme)||"auto";document.documentElement.dataset.theme=t==="auto"?(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"):t}catch(e){}
</script>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand"><span class="brand-dot">✦</span>מאמן <b>ידע</b></div>
    <div class="spacer"></div>
    <span class="chip-stat" id="streakChip" title="רצף ימים">🔥 <span>0</span></span>
    <span class="chip-stat" id="levelChip" title="רמה">⭐ <span>1</span></span>
    <button class="icon-btn" id="settingsBtn" aria-label="הגדרות">⚙️</button>
  </div>
</header>

<main id="app"></main>

<nav class="nav" aria-label="ניווט ראשי">
  <div class="nav-in">
    <button data-tab="home" class="on"><span class="ni">🏠</span>בית</button>
    <button data-tab="practice"><span class="ni">🎯</span>תרגול</button>
    <button data-tab="stats"><span class="ni">📊</span>התקדמות</button>
    <button data-tab="glossary"><span class="ni">📖</span>מילון</button>
  </div>
</nav>

<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
